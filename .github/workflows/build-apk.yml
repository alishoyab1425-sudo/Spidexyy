name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          unzip -o "$(ls spidexy_capacitor_admob_v*.zip | sort -V | tail -1)"
          cd spidexy
          npm install
          npx cap add android
          node setup-android.js
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Spidexy-APK
          path: spidexy/android/app/build/outputs/apk/debug/app-debug.apk
# END
